<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajay Kushwaha | The Digital Signature</title>
<style>
:root{--bg:#080808;--gold:#dfc078;--gold2:#f2dda2;--line:#806a3e;--muted:#c7b88f}
*{box-sizing:border-box}body{margin:0;background:#080808;color:var(--gold2);font-family:Arial,Helvetica,sans-serif}
.page{width:min(100%,840px);margin:auto;padding:26px 22px 40px;background:#080808;min-height:100vh}
.top{text-align:center;color:var(--gold);letter-spacing:2px;font-size:19px;margin:0 0 24px}
.top:after{content:"";display:block;width:150px;height:2px;background:var(--line);margin:13px auto 0}
.profile{text-align:center;padding:22px 0 30px}
.avatar{width:180px;height:180px;border-radius:50%;border:5px solid var(--gold);object-fit:cover;object-position:center 35%;padding:0}
h1{font-size:clamp(29px,6vw,46px);margin:18px 0 0;color:var(--gold2)}
section{border-top:1px solid var(--line);padding:25px 0 28px}
h2{font-size:clamp(24px,4vw,34px);text-align:center;margin:16px 0 22px;color:var(--gold2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a.tile,.tile{min-height:104px;border:1.5px solid var(--line);border-radius:22px;color:var(--gold2);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:17px;text-align:center;padding:12px;background:transparent}
.tile .ico{font-size:27px;line-height:1;color:var(--gold)}
.social .tile{min-height:72px;flex-direction:row;justify-content:flex-start;padding-left:24px;gap:15px}
.payment{border:1.5px solid var(--line);border-radius:22px;padding:20px;display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center}
.qr{width:100%;background:#fff;padding:9px;border-radius:12px;display:block}
.payment .eyebrow{color:var(--muted);font-size:16px;margin-bottom:12px}
.upi{font-size:clamp(14px,2.8vw,20px);color:#fff;overflow-wrap:anywhere;margin-bottom:18px}
.pay{display:block;text-align:center;background:linear-gradient(100deg,#c49d50,#e2c176);color:#090909;border-radius:18px;padding:18px 10px;font-size:21px;font-weight:bold;text-decoration:none}
.footer{text-align:center;color:#927c4e;font-size:11px;letter-spacing:2px;padding-top:24px}
@media(max-width:520px){.page{padding:24px 5.8vw 34px}.avatar{width:150px;height:150px}.grid{gap:10px}a.tile{min-height:94px;font-size:15px}.social .tile{min-height:66px;padding-left:14px}.payment{grid-template-columns:120px 1fr;gap:13px;padding:13px}.payment .eyebrow{font-size:13px}.pay{font-size:17px;padding:15px 6px}}
@media(max-width:360px){.payment{grid-template-columns:1fr}.qr{max-width:180px;margin:auto}}
</style></head><body><main class="page">
